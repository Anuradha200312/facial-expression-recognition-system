version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - FACE_CONF_THRESH=0.40
      - FACE_CROP_MARGIN=0.15

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8501:8080"
    environment:
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
